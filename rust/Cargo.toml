[package]
name = "torrust-deploy"
version = "0.1.0"
edition = "2021"
authors = ["Torrust Team"]
description = "Deploy Torrust Tracker to cloud providers using OpenTofu/Terraform and cloud-init"
license = "MIT"
[[bin]]
name = "torrust-deploy"
path = "src/main.rs"
[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "color"] }
# Async runtime
tokio = { version = "1.35", features = ["full"] }
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# File handling and utilities
tempfile = "3.8"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
[dev-dependencies]
# Testing
rstest = "0.18"
tempfile = "3.8"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
